<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 浏览器助手</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2937; --border: #e5e7eb;
      --primary: #3b82f6; --surface: #f8fafc; --muted: #6b7280;
      --danger: #ef4444; --success: #10b981;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2937; --text: #e5e7eb; --border: #374151;
        --primary: #60a5fa; --surface: #111827; --muted: #9ca3af;
        --danger: #f87171; --success: #34d399;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px; max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px;
      overflow: hidden;
      color-scheme: light dark; /* 原生控件（下拉/数字步进器/checkbox）跟随浏览器主题 */
    }
    .page { display: none; padding: 14px; max-height: 560px; overflow-y: auto; }
    .page.active { display: block; }
    .back {
      cursor: pointer; color: var(--primary); font-size: 12px;
      margin-bottom: 10px; display: inline-flex; align-items: center; gap: 3px;
    }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 16px; display: flex; align-items: center; gap: 6px; }
    .subtitle { font-size: 11px; color: var(--muted); margin-bottom: 12px; }

    /* ─── 插件列表 ─── */
    .plugin-list { display: flex; flex-direction: column; gap: 6px; }
    .plugin-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); cursor: pointer; transition: border-color 0.15s;
    }
    .plugin-card:hover { border-color: var(--primary); }
    .plugin-icon { font-size: 20px; flex-shrink: 0; }
    .plugin-info { flex: 1; min-width: 0; }
    .plugin-name { font-weight: 600; font-size: 13px; }
    .plugin-desc { font-size: 11px; color: var(--muted); }

    .toggle {
      width: 32px; height: 18px; border-radius: 9px; border: none;
      cursor: pointer; transition: background 0.15s; position: relative;
      background: #d1d5db; flex-shrink: 0;
    }
    .toggle.on { background: var(--primary); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%; background: white;
      transition: transform 0.15s;
    }
    .toggle.on::after { transform: translateX(14px); }

    .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: border-color 0.15s; margin-top: 6px;
    }
    .menu-item:hover { border-color: var(--primary); }
    .add-card {
      border-style: dashed; justify-content: center; color: var(--muted);
    }
    .add-card:hover { color: var(--primary); }

    /* ─── 表单 ─── */
    .form-group { margin-bottom: 10px; }
    .profile-list { display: flex; flex-direction: column; gap: 5px; }
    .profile-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 9px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
      cursor: pointer; font-size: 12px;
    }
    .profile-row:hover { border-color: var(--primary); }
    .profile-row.active { border-color: var(--primary); background: rgba(59,130,246,0.08); }
    .profile-main { flex: 1; min-width: 0; }
    .profile-name { font-weight: 600; }
    .profile-meta { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-lat { font-size: 10px; color: var(--primary); flex-shrink: 0; white-space: nowrap; }
    .profile-del { flex-shrink: 0; color: var(--muted); cursor: pointer; padding: 0 3px; font-size: 14px; }
    .profile-del:hover { color: var(--danger); }
    .profile-empty { font-size: 11px; color: var(--muted); padding: 8px 0; }    label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 3px; }
    input, textarea, select {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text); font-size: 12px;
      font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 50px; }
    textarea.code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; min-height: 120px; }
    .btn {
      padding: 7px 14px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 11px; padding: 6px; border-radius: 4px; display: none; margin-top: 6px; }
    .status.show { display: block; }
    .status.success { background: rgba(16,185,129,0.1); color: var(--success); }
    .status.error { background: rgba(239,68,68,0.1); color: var(--danger); }

    .server-status {
      display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted);
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    }
    .server-dot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; }
    .server-dot.online { background: var(--success); }
    .server-dot.offline { background: var(--danger); }

    /* ─── JSONEditor 表单适配（无框化：窄弹窗里不显示多余的框/边框）─── */
    /* 二值配置（boolean 字段，jsoneditor 渲染为 checkbox）→ 样式化为 toggle 开关（popup.js 统一注入 format: checkbox） */
    #cfgDynamicFields input[type="checkbox"] {
      -webkit-appearance: none; appearance: none;
      /* jsoneditor 会给 checkbox 加 inline style width:auto（.je-checkbox），inline 优先级最高，
         必须 !important 才能压成 toggle 轨道宽度 */
      width: 36px !important; height: 20px; border-radius: 10px;
      background: var(--border); border: none; outline: none; cursor: pointer;
      position: relative; vertical-align: middle; margin: 0 6px 0 0; flex-shrink: 0;
      transition: background 0.15s;
    }
    #cfgDynamicFields input[type="checkbox"]::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
      transition: transform 0.15s;
    }
    #cfgDynamicFields input[type="checkbox"]:checked { background: var(--primary); }
    #cfgDynamicFields input[type="checkbox"]:checked::after { transform: translateX(16px); }
    /* 二值开关布局：jsoneditor 把 checkbox 插在标题文字前面（label > [input, 文字]），
       用 flex row-reverse 把视觉顺序反转成「文字在左、开关在右」，space-between 把开关推到最右。
       所有 boolean 字段（任意插件、任意嵌套）统一生效 */
    #cfgDynamicFields [data-schematype="boolean"] label {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 0;
    }
    #cfgDynamicFields [data-schematype="boolean"] label input[type="checkbox"] { margin: 0; }
    /* ─── JSONEditor 表单适配（无框化 + 视觉层级）───
       解析 configSchema 的渲染层级（所有插件、任意嵌套结构通用）：
         层级一  大标题   = schema 根 title（「插件配置」）   → 14px/700/正文色
         层级二  条目标题 = 各字段的 title（任意类型）        → 11px/500/灰
         层级三  说明文字 = 各字段的 description             → 10px/更淡
       渲染结构：容器类型字段（object/array）标题是 span.je-header.h3（h3 自带大字号，
       必须覆盖）；基础类型是 .je-form-input-label；checkbox 是裸 label（继承全局 label 规则） */
    .je-object__container { margin-top: 4px; }
    .je-form-input-label { color: var(--muted); font-size: 11px; font-weight: 500; }
    .je-form-input-label .required { color: var(--danger); }
    /* 层级二：条目标题（object/array 等容器字段；基础类型已由 .je-form-input-label 覆盖） */
    [data-schematype="array"] > .je-header,
    [data-schematype="object"] > .je-header {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    /* 层级一：大标题（schema 根 title）——定义在条目标题之后，靠后定义覆盖同特异性规则
       （根对象 schematype 也是 object，两条规则都会命中根标题，后定义的胜出） */
    [data-schemapath="root"] > .je-header {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 6px;
    }
    /* 层级三：说明文字（description，class .je-form-input-label，兜底裸 p）：必须比条目标题更小更淡。
       jsoneditor 注入的 #theme-html 样式表带 div[data-theme="html"] .je-form-input-label{font-weight:bold}，
       特异性高于本级规则且注入晚于 head 样式，必须 !important 压掉粗体，与裸 p 说明保持同一视觉 */
    #cfgDynamicFields .je-form-input-description,
    #cfgDynamicFields p {
      color: var(--muted) !important;
      font-size: 10px !important;
      font-weight: 400 !important;
      font-style: normal !important;
      margin: 2px 0 4px;
      opacity: 0.85;
    }
    /* 库默认 height:300px，弹窗里太高；用更高特异性覆盖（不用 !important，避免挡住拖拽伸缩） */
    #cfgDynamicFields .je-textarea { height: auto; min-height: 60px; }
    /* 面板去框：html 主题会给 .je-indented-panel 加四边 #ddd 边框（包住整个表单的白色框），全部去掉 */
    .je-indented-panel {
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    /* 关键词数组行：输入框 + ✕ 图标删除按钮同行，隐藏序号标题（关键词 1） */
    [data-schematype="array"] .je-indented-panel .je-indented-panel {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    [data-schematype="array"] .je-indented-panel .je-indented-panel .form-control { flex: 1; margin: 0; }
    /* 库主题规则 div[data-theme="html"] .je-form-input-label{display:block} 特异性更高，需 !important */
    [data-schematype="array"] .je-form-input-label { display: none !important; }
    [data-schematype="array"] .je-indented-panel .je-indented-panel .json-editor-btn-delete {
      width: 28px; height: 28px; padding: 0; flex-shrink: 0;
      border: none; background: transparent; border-radius: 0;
      font-size: 14px; line-height: 1; color: var(--muted); cursor: pointer;
    }
    [data-schematype="array"] .je-indented-panel .je-indented-panel .json-editor-btn-delete span { display: none; }
    [data-schematype="array"] .je-indented-panel .je-indented-panel .json-editor-btn-delete:hover { color: var(--danger); }
    /* 增删行等操作按钮（库无默认样式） */
    .json-editor-btn-add, .json-editor-btn-delete, .json-editor-btn-subtract,
    .json-editor-btn-copy, .json-editor-btn-cancel, .json-editor-btn-save,
    .json-editor-btn-collapse, .json-editor-btn-edit,
    .json-editor-btn-movedown, .json-editor-btn-moveup {
      padding: 3px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .json-editor-btn-add:hover { border-color: var(--primary); color: var(--primary); }
    .json-editor-btn-delete:hover, .json-editor-btn-subtract:hover {
      border-color: var(--danger); color: var(--danger);
    }
    .je-errormsg { color: var(--danger) !important; font-size: 11px; }
  </style>
</head>
<body>
  <!-- ═══ 首页：插件列表 ═══ -->
  <div class="page active" id="page-home">
    <h1>🤖 AI 浏览器助手</h1>
    <div class="subtitle">插件商店 — 管理你的 AI 插件</div>
    <div class="plugin-list" id="pluginList"></div>
    <div class="menu-item add-card" id="gotoAdd">
      <span style="font-size:16px">+</span> 添加新插件
    </div>
    <div class="menu-item" id="gotoSettings">
      ⚙️ 设置（API Key / 模型）
    </div>
    <div class="server-status" id="serverStatus">
      <span class="server-dot" id="serverDot"></span>
      <span id="serverText">检查服务器状态...</span>
    </div>
  </div>

  <!-- ═══ 插件详情 ═══ -->
  <div class="page" id="page-detail">
    <a class="back" id="detailBack">← 返回列表</a>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:24px" id="detailIcon">🤖</span>
      <div>
        <div style="font-weight:600;font-size:14px" id="detailTitle">名称</div>
        <div style="font-size:11px;color:var(--muted)" id="detailMeta">ID: -</div>
      </div>
    </div>
    <div id="detailError" style="display:none;padding:8px 12px;margin-bottom:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;color:var(--danger);font-size:12px;white-space:pre-wrap"></div>
    <div class="form-group">
      <label>插件名称</label>
      <input type="text" id="cfgName" />
    </div>
    <div class="form-group">
      <label>描述</label>
      <input type="text" id="cfgDesc" />
    </div>
    <div id="cfgDynamicFields"></div>
    <div id="detailStatus" class="status"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="cfgSaveBtn">保存</button>
      <button class="btn btn-secondary" id="cfgEditBtn">✏️ 编辑插件</button>
    </div>
  </div>

  <!-- ═══ 设置页 ═══ -->
  <div class="page" id="page-settings">
    <a class="back" id="settingsBack">← 返回列表</a>
    <h1 style="font-size:15px;margin-bottom:8px">⚙️ 设置</h1>

    <div class="form-group">
      <label>配置方案（点一行即切换为当前使用）</label>
      <div id="profileList" class="profile-list"></div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn btn-secondary" id="newProfileBtn">＋ 新建方案</button>
        <button class="btn btn-secondary" id="benchAllBtn">⏱ 全部测延迟</button>
      </div>
    </div>

    <div style="border-top:1px solid var(--border);margin:12px 0 10px"></div>

    <div class="form-group">
      <label>方案名称</label>
      <input type="text" id="profileName" placeholder="如：方舟 AgentPlan" />
    </div>
    <div class="form-group">
      <label>API 端点</label>
      <input type="text" id="apiEndpoint" placeholder="https://api.openai.com/v1" />
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>模型</label>
      <select id="model">
        <option value="doubao-seed-2.0-mini">豆包 Seed 2.0 Mini（最快，实测首字 ~0.36s）</option>
        <option value="doubao-seed-2.1-turbo">豆包 Seed 2.1 Turbo</option>
        <option value="gpt-4o-mini">GPT-4o-mini</option>
        <option value="gpt-4o">GPT-4o</option>
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="glm-5.3-flash">GLM 5.3 Flash</option>
        <option value="qwen-plus">Qwen Plus</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="form-group" id="customModelGroup" style="display:none">
      <label>自定义模型名</label>
      <input type="text" id="customModel" placeholder="输入模型名称" />
    </div>
    <div id="settingsStatus" class="status"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">保存方案</button>
      <button class="btn btn-secondary" id="testBtn">测试连接</button>
      <button class="btn btn-secondary" id="benchBtn">⏱ 测延迟</button>
    </div>
    <div id="benchResult" style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
