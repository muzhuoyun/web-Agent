<!DOCTYPE html>
<html style="height:100%">
<head>
<meta charset="UTF-8">
<title>安装新插件</title>
<link rel="stylesheet" href="../codemirror/codemirror.min.css">
<link rel="stylesheet" href="../codemirror/material-darker.min.css" id="cm-dark-theme" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fff;--text:#1f2937;--border:#e5e7eb;--primary:#3b82f6;--surface:#f8fafc;--muted:#6b7280;--danger:#ef4444;--success:#10b981}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--text:#e5e7eb;--border:#374151;--primary:#60a5fa;--surface:#1f2937;--muted:#9ca3af;--danger:#f87171;--success:#34d399}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}
.header{padding:16px 24px 8px;flex-shrink:0}
.header h1{font-size:20px}
.header .subtitle{font-size:12px;color:var(--muted)}
.body{flex:1;display:flex;min-height:0;padding:0 24px 12px;gap:8px}
.left{flex:0 0 30%;min-width:200px;max-width:50%;overflow-y:auto;padding-right:8px;display:flex;flex-direction:column}
.left .CodeMirror{flex:1;height:auto;min-height:150px}
.right{flex:1;min-width:300px;min-height:0;display:flex;flex-direction:column}
.right .section-title{flex-shrink:0;font-size:13px;font-weight:600;margin-bottom:4px}
.footer{flex-shrink:0;padding:8px 24px 16px}
.splitter{flex:0 0 6px;cursor:col-resize;background:var(--border);border-radius:3px;flex-shrink:0;transition:background .15s}
.splitter:hover{background:var(--primary)}
.CodeMirror{flex:1;height:auto;border:1px solid var(--border);border-radius:6px;font-size:13px}
.CodeMirror-scroll{overflow:auto!important;min-height:150px}
.right .CodeMirror-scroll{min-height:300px}
.CodeMirror-gutters{border-radius:6px 0 0 6px}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.status{font-size:12px;padding:8px 12px;border-radius:6px;display:none;white-space:pre-wrap}
.status.show{display:block}
.status.error{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.status.success{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.2)}
textarea.meta{width:100%;min-height:150px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;outline:none;resize:vertical}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>➕ 安装新插件</h1>
  <div class="subtitle">填入插件元数据和代码，服务器会自动校验并安装</div>
</div>

<div class="body" id="body">
  <div class="left" id="leftPane">
    <div class="section-title">📋 元数据</div>
    <textarea id="metaInput" class="meta" spellcheck="false" placeholder='{"id":"my-plugin","name":"我的插件","triggers":["alt-select"]}'></textarea>
    <div class="hint">id、name、triggers 必填</div>
    <div id="metaStatus" class="status error" style="display:none;margin-top:4px"></div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="right">
    <div class="section-title">💻 核心代码</div>
    <textarea id="codeInput" spellcheck="false" placeholder="async function initPlugin(ctx) { ... }"></textarea>
    <div class="hint">运行环境 content-script，ctx 提供 api、config</div>
    <div id="codeStatus" class="status error" style="display:none;margin-top:4px"></div>
  </div>
</div>

<div class="footer" style="display:flex;align-items:center;gap:8px">
  <button class="btn btn-primary" id="installBtn">安装并验证</button>
  <div id="installStatus" class="status" style="margin:0;flex:1"></div>
</div>

<script src="../codemirror/codemirror.min.js"></script>
<script src="../codemirror/javascript.min.js"></script>
<script src="../codemirror/active-line.min.js"></script>
<script src="../codemirror/placeholder.min.js"></script>
<script src="install.js"></script>
<script>
(function(){
  var splitter=document.getElementById('splitter'),left=document.getElementById('leftPane')
  var drag=false,sx,sw
  splitter.addEventListener('mousedown',function(e){drag=true;sx=e.clientX;sw=left.offsetWidth;document.body.style.cursor='col-resize';document.body.style.userSelect='none'})
  document.addEventListener('mousemove',function(e){if(!drag)return;var nw=sw+e.clientX-sx,p=nw/document.getElementById('body').offsetWidth*100;if(p<20)p=20;if(p>50)p=50;left.style.flex='0 0 '+p+'%'})
  document.addEventListener('mouseup',function(){if(drag){drag=false;document.body.style.cursor='';document.body.style.userSelect=''}})
})()
</script>
</body>
</html>
